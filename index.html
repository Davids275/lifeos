<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#05050A" />
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- iOS: tela cheia de verdade ao abrir pelo ícone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life OS" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #05050A; color: #fff;
    /* respeita o entalhe/notch e a barra de gestos */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #05050A; z-index: 9999; font-family: system-ui, sans-serif;
  }
  #boot .hex {
    width: 54px; height: 54px; border: 2px solid #00F0FF; border-radius: 8px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:.35; transform: scale(.9);} 50% { opacity:1; transform: scale(1);} }
  #boot .txt { color: #64748B; font-size: 13px; letter-spacing: .08em; }
  #boot .err { color: #EF4444; font-size: 12px; max-width: 300px; text-align: center; line-height: 1.5; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.3.31?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<div id="boot">
  <div class="hex"></div>
  <div class="txt">CARREGANDO LIFE OS</div>
  <div class="err" id="boot-err"></div>
</div>

<script type="module">
  const boot = document.getElementById('boot');
  const bootErr = document.getElementById('boot-err');

  try {
    const React = await import('react');
    const { createRoot } = await import('react-dom/client');
    const mod = await import('./app.js');
    const App = mod.default;

    createRoot(document.getElementById('root')).render(
      React.createElement(React.StrictMode, null, React.createElement(App))
    );
    boot.remove();

    /* service worker: depois da primeira abertura, funciona sem internet */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {
    bootErr.textContent = 'Não consegui carregar. Confira a internet na primeira abertura — depois disso ele funciona offline. Detalhe: ' + (e && e.message ? e.message : e);
    console.error(e);
  }
</script>
</body>
</html>
